name: blinq
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.24+2

environment:
  sdk: '>=3.1.5 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  # for api
  dio: ^4.0.6
  logger: ^2.0.2+1
  http: any

  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  lottie: ^2.2.0
  image: 3.2.0
  image_picker: ^1.0.4
  video_player: ^2.7.2
  video_compress: ^3.1.3
  flutter_image_compress: ^2.1.0
  speech_to_text: ^6.3.0
  flutter_painter_v2: ^2.0.1
  image_cropper: ^5.0.0
  flutter_screenutil: 5.9.0
  flutter_blue_plus: ^1.3.0
  app_settings: ^5.1.1
  url_launcher: ^6.1.14
  mailto: ^2.0.0
  fluttertoast: ^8.2.5
  flutter_svg: ^2.0.7
  get_it: ^7.6.4
  flutter_multi_formatter: ^2.11.16
  in_date_utils: ^1.2.0+2

  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.13.1

  #pickers
  flutter_contacts: ^1.1.9+2
  file_picker: ^6.0.0

  # state mangment
  flutter_bloc: ^8.1.6

  # Flutter plugin for local db for small data
  hive: ^2.2.3
  path_provider: ^2.1.1

  # country code
  country_code_picker: ^3.0.0

  # for bluetooth modules
  flutter_reactive_ble: ^5.1.0
  step_progress_indicator: ^1.0.2
  sprintf: ^7.0.0

  # for scan blinq user
  ai_barcode_scanner: ^5.2.1

  permission_handler: ^11.3.1
  open_file: ^3.5.4

  # for map
  google_maps_flutter: ^2.9.0
  # take user permission to location
  geolocator: ^10.0.0
  location: ^5.0.3
  # for datetime and internationalization
  intl: ^0.19.0
  # for animation the widget
  animate_do: ^3.0.2
  # for pdf view in app
  syncfusion_flutter_pdfviewer: ^27.1.48

  # for google and apple sign in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  flutter_secure_storage: ^9.0.0
  # for signature
  hand_signature: ^3.0.1
  # for animation button
  scale_button: ^2.1.2

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  #  localization
  easy_localization: ^3.0.7
  #  ui utils
  email_validator: ^2.1.17
  another_flushbar: ^1.12.30
  carousel_slider: ^5.0.0
  device_info_plus: ^10.1.2
  phosphor_flutter: 2.0.1


  #notifications
  firebase_core: ^2.31.1
  firebase_messaging: ^14.9.2
  #flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the analysis_options.yaml file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  import_sorter: ^4.6.0
  mockito: any
  bloc_test: ^9.1.5
  analyzer: ^6.7.0



# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/fonts/
    - assets/fonts/archivo/
    - assets/icons/
    - assets/icons/arrows/
    - assets/images/
    - assets/images/car/
    - assets/images/car/van/top/
    - assets/images/car/van/left/
    - assets/images/car/van/right/
    - assets/images/car/van/front/
    - assets/images/car/van/back/
    - assets/images/car/new/front/
    - assets/images/car/new/left/
    - assets/images/car/new/right/
    - assets/images/car/new/back/
    - assets/images/car/new/top/
    - assets/images/car/blank/
    - assets/images/car/moto/
    - assets/images/moto/
    - assets/images/van/
    - assets/images/van/blank/
    - assets/images/info/
    - assets/images/new2,1/
    - assets/locale/
    - assets/video/
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  fonts:
    - family: SFUIDisplay
      fonts:
        - asset: assets/fonts/SF UI Display Regular.otf
          weight: 400
        - asset: assets/fonts/SF UI Display Medium.otf
          weight: 500
        - asset: assets/fonts/SF UI Display SemiBold.otf
          weight: 600
        - asset: assets/fonts/SF UI Display Bold.otf
          weight: 700
        - asset: assets/fonts/SF UI Display Extra Bold.otf
          weight: 900
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo/Archivo-Thin.ttf
          weight: 100
        - asset: assets/fonts/archivo/Archivo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/archivo/Archivo-Light.ttf
          weight: 300
        - asset: assets/fonts/archivo/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/archivo/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/archivo/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/archivo/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/archivo/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/archivo/Archivo-Black.ttf
          weight: 900